<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Top Bar -->
      <div class="topbar">
        <div class="brand">
          <div class="brand-title">Maps Lead Scraper</div>
          <div id="planBadge" class="brand-sub">Free Tier</div>
        </div>
        <button id="themeToggle" class="icon-btn" title="Toggle Theme">
          🌓
        </button>
      </div>

      <!-- License Activation Bar (Hidden for Pro) -->
      <div id="licenseSection" class="results-card">
        <div class="results-header"><span>Activate Pro License</span></div>
        <div style="display: flex; gap: 6px; margin-top: 4px">
          <input
            type="text"
            id="licenseInput"
            placeholder="Paste Lemon Squeezy Key Here"
            style="
              flex: 1;
              padding: 6px;
              border-radius: 6px;
              border: 1px solid var(--border);
              font-size: 11px;
            "
          />
          <button
            id="activateBtn"
            class="btn btn-primary"
            style="padding: 6px 10px; font-size: 11px; flex: none"
          >
            Activate
          </button>
        </div>
      </div>

      <!-- Counter Display -->
      <div class="usage-card">
        <div class="usage-row">
          <span class="usage-label">Daily Lead Usage</span>
          <span id="usageValue" class="usage-value">0 / 15</span>
        </div>
        <div class="usage-bar">
          <div id="usageFill" class="usage-bar-fill"></div>
        </div>
        <div
          id="limitNotice"
          class="notice"
          style="display: none; margin-top: 8px"
        >
          ⚠️ Free limit reached. Upgrade to Pro via the link in the readme for
          unlimited exports!
        </div>
      </div>

      <!-- Core Controls -->
      <div class="controls">
        <button id="startBtn" class="btn btn-primary">⚡ Start Scraping</button>
        <button id="stopBtn" class="btn btn-danger" style="display: none">
          🛑 Stop
        </button>
      </div>

      <!-- Export Action -->
      <div class="results-card">
        <div class="results-header">
          <span>Scraped Data Output</span>
          <span id="liveCounter">0 found</span>
        </div>
        <div class="export-row" style="margin-top: 6px">
          <button id="exportBtn" class="btn btn-secondary" disabled>
            ⬇️ Export CSV Spreadsheet
          </button>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
